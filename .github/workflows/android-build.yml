name: Android build

# Build APK debug cho mọi push/PR vào main; build + ký APK release CHỈ khi
# tự bấm chạy tay (workflow_dispatch) - tránh tốn phút CI ký/minify không cần
# thiết trên mỗi commit nhỏ.
#
# ===== Cấu trúc 3 job (đổi từ 1 job "build" duy nhất sang multi-job) =====
# validation    : giải nén source, verify checksum (nếu có), typecheck Deno, chạy pytest -
#                 chạy NHANH, KHÔNG build Android, luôn chạy để phát hiện lỗi sớm.
# build-debug   : phụ thuộc validation, build APK debug (push/PR, hoặc workflow_dispatch
#                 không tick build_release).
# build-release : phụ thuộc validation, build APK release đã ký (chỉ workflow_dispatch có
#                 tick build_release=true) - có "environment: release" để bật phê duyệt thủ
#                 công (xem ghi chú ở job build-release).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build APK release (đã ký + minify) thay vì debug"
        type: boolean
        default: false

jobs:
  # ============================================================
  # JOB 1/3: validation - kiểm tra nhanh, không build Android
  # ============================================================
  validation:
    runs-on: ubuntu-22.04
    outputs:
      # Đọc từ package.json - build-debug/build-release dùng lại để đặt tên artifact, không
      # cần tự đọc lại. Dùng package.json (không phải android/app/build.gradle) vì
      # build.gradle chỉ tồn tại SAU khi `npx cap add android` chạy (chưa có ở job này), còn
      # package.json luôn có sẵn trong repo và versionCode/versionName mặc định Capacitor sinh
      # ra ("1.0") không phản ánh version thật của bạn - package.json.version là nguồn version
      # có ý nghĩa duy nhất hiện có trong repo.
      app_version: ${{ steps.read_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Fix (audit): trước đây 3.11 trong khi báo cáo audit bên ngoài ghi nhận pyproject.toml
          # của repo yêu cầu ">=3.13" - lệch version giữa local/CI làm mất tính reproducible.
          # LƯU Ý: không tự xác minh được nội dung pyproject.toml thật (chưa có trong source
          # được cung cấp để đối chiếu) - nếu pyproject.toml của bạn ghi khác ">=3.13", sửa số này.
          python-version: '3.13'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ===== Caching =====
      # Repo chưa có package-lock.json/requirements.txt thật (không tạo được ở đây vì môi
      # trường soạn workflow này không có mạng để chạy npm install/pip freeze) - dùng hash của
      # package.json / chính file workflow này làm key tạm. Nếu sau này bạn tự tạo được
      # package-lock.json (qua Termux hoặc máy khác), đổi hashFiles bên dưới sang
      # hashFiles('package-lock.json') để cache chính xác hơn theo từng version dependency.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Key theo hash chính file workflow này - vì version pytest đang ghim ngay trong bước
          # "Run Python tests" bên dưới, đổi version ở đó tự động làm cache key đổi theo.
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/android-build.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase-functions/groq-relay/index.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # GitHub KHÔNG tự giải nén file .zip lúc upload - nếu bạn commit thẳng các file
      # atun-translator-part*.zip (chưa tự giải nén trên máy/điện thoại), bước này tự giải nén
      # chúng ra gốc repo trước khi npm install/build. Nếu source đã ở dạng thư mục thật (đã tự
      # giải nén rồi mới commit) thì bước này tự bỏ qua, không làm gì cả.
      #
      # Verify checksum (tuỳ chọn): nếu bạn có commit kèm 1 file "<tên_zip>.sha256" ngay cạnh
      # mỗi file zip (nội dung 1 dòng dạng "<hash>  <tên_zip>", đúng định dạng lệnh `sha256sum`
      # xuất ra - có thể tạo bằng app "aShell You" trên điện thoại: `sha256sum ten.zip >
      # ten.zip.sha256`), bước này tự đối chiếu và FAIL nếu sai. Không có file .sha256 nào thì
      # bỏ qua bước verify (không bắt buộc phải áp dụng ngay - chỉ bật khi bạn sẵn sàng).
      - name: Extract project source (nếu còn ở dạng .zip) + verify checksum (nếu có)
        run: |
          shopt -s nullglob
          zips=(atun-translator-part*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Không thấy file atun-translator-part*.zip nào ở gốc repo - coi như source đã được giải nén sẵn (bỏ qua giải nén + verify checksum)."
          else
            for z in "${zips[@]}"; do
              if [ -f "$z.sha256" ]; then
                echo "Verify checksum $z..."
                sha256sum -c "$z.sha256" || { echo "::error::Checksum của $z không khớp file .sha256 đi kèm - source có thể bị hỏng/sửa ngoài ý muốn khi tải lên. Dừng build."; exit 1; }
              else
                echo "Không thấy $z.sha256 - bỏ qua verify checksum cho $z (tuỳ chọn, không bắt buộc)."
              fi
              echo "Giải nén $z"
              unzip -o -q "$z" -d .
            done
          fi
          test -f package.json || { echo "::error::Vẫn không thấy package.json sau khi giải nén - kiểm tra lại các file .zip đã commit đủ 4 part chưa (native/www/config-scripts/backend-tests)."; exit 1; }

      - name: Đọc version từ package.json
        id: read_version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # ===== Typecheck Supabase Edge Function (groq-relay) bằng chính trình biên dịch Deno -
      # bắt lỗi cú pháp/kiểu TypeScript NGAY ở CI thay vì phải đợi `supabase functions deploy`
      # thất bại (bước deploy KHÔNG nằm trong workflow này, làm thủ công).
      # LƯU Ý: groq-relay import @supabase/supabase-js qua esm.sh (dùng cho bảng
      # translate_quota_status), nên bước `deno check` này CẦN mạng để tải/phân giải import đó -
      # GitHub-hosted runner có sẵn mạng nên không cần thêm cấu hình gì.
      - name: Typecheck Supabase Edge Function
        run: deno check supabase-functions/groq-relay/index.ts

      # Test các hàm thuần đã tách sang pure.ts (xem comment đầu file đó) - KHÔNG import/chạy
      # index.ts (sẽ tự mở Deno.serve + khởi tạo Supabase client thật, không an toàn cho test).
      # Test cần --allow-env (giới hạn đúng 2 biến) vì 1 số test case tự set/xoá tạm
      # GROQ_API_KEY/GROQ_API_KEY_2 để kiểm tra groqFetchWithFallback() (xem pure.test.ts) -
      # không cần --allow-net vì mọi lệnh gọi fetch trong test đều dùng bản giả lập (mock), không
      # gọi mạng thật.
      - name: Run Deno tests (groq-relay pure functions)
        run: deno test --allow-env=GROQ_API_KEY,GROQ_API_KEY_2 supabase-functions/groq-relay/pure.test.ts

      # ===== Static analysis JS (ESLint) =====
      # KHÔNG cần "npm install" trước bước này - "npx --yes eslint@9 ..." tự tải chính ESLint để
      # chạy, không đụng tới node_modules/package.json. Job validation trước đây có 1 bước
      # "Install npm deps" ở đây nhưng KHÔNG có bước nào sau đó trong job này thật sự cần
      # node_modules (build APK - nơi thật sự cần npm install - nằm ở job build-debug/
      # build-release riêng) - đã xoá vì chỉ tốn thời gian CI vô ích.
      # BÁO CÁO TRƯỚC, CHƯA CHẶN BUILD (continue-on-error: true): www/app.js và app.module.js
      # chưa từng chạy qua ESLint từ trước tới giờ, khả năng cao có sẵn hàng loạt cảnh báo không
      # liên quan gì tới thay đổi thực tế nào - bật chặn cứng ngay sẽ khoá cả pipeline vì lỗi tồn
      # đọng cũ, rất khó debug qua điện thoại. Khi nào các finding hiện tại đã được xem qua/dọn
      # bớt, đổi continue-on-error thành false để ESLint thật sự chặn build lúc có lỗi mới.
      # Kết quả lưu ra file (tee) để upload cùng detekt-report.txt ở bước "Upload báo cáo lint"
      # bên dưới - continue-on-error nghĩa là output chỉ hiện trong log job, dễ bị lướt qua/mất
      # trên điện thoại nếu không có file tải riêng.
      - name: Lint JS (ESLint, chỉ báo cáo)
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes eslint@9 www/app.js www/app.module.js --no-config-lookup --config eslint.config.js 2>&1 | tee eslint-report.txt

      - name: Run Python tests
        run: |
          # Fix (audit): trước đây "pip install pytest requests" không ghim version - CI có thể
          # âm thầm đổi hành vi giữa các lần chạy nếu PyPI phát hành bản pytest mới không tương
          # thích ngược. Ghim khoảng version thay vì để trống hẳn (không ghim tuyệt đối 1 bản
          # duy nhất vì không có lock file/venv thật để xác minh 1 con số cụ thể còn tồn tại và
          # chạy đúng trong môi trường này).
          # Fix (audit đợt 2): đã xoá "requests" khỏi lệnh install - grep lại toàn bộ tests/ xác
          # nhận không file nào import "requests" (chỉ dùng thư viện chuẩn/pytest) - tàn dư từ bộ
          # test cũ, giữ lại trước đây chỉ vì không chắc, giờ đã xác nhận chắc nên xoá thẳng.
          pip install "pytest>=8.0,<9"
          pytest tests/translate tests/cloud_stt_segment tests/auth_token -v

      # ===== Static analysis Python (Ruff) - BÁO CÁO TRƯỚC, CHƯA CHẶN BUILD, cùng lý do với
      # ESLint ở trên (scripts/ + tests/ chưa từng chạy qua linter nào). =====
      - name: Lint Python (Ruff, chỉ báo cáo)
        continue-on-error: true
        run: |
          set -o pipefail
          pip install "ruff>=0.6,<1"
          ruff check scripts tests 2>&1 | tee ruff-report.txt

      # ===== Static analysis Kotlin (Detekt CLI standalone) =====
      # Chạy thẳng trên native/*.kt bằng Detekt CLI (jar tải trực tiếp từ GitHub Releases, ghim
      # version) - KHÔNG cần scaffold cả project Android (không cần `npx cap add android`/JDK
      # setup ở job này), giữ đúng tinh thần "validation nhanh". Dùng --build-upon-default-config
      # (bộ rule mặc định của Detekt) thay vì tự viết detekt.yml tuỳ chỉnh, vì không có cách nào
      # tự chạy thử ở đây để biết chỉnh ngưỡng nào là hợp lý cho riêng codebase này.
      # BÁO CÁO TRƯỚC, CHƯA CHẶN BUILD - cùng lý do với ESLint/Ruff ở trên.
      - name: Lint Kotlin (Detekt, chỉ báo cáo)
        continue-on-error: true
        run: |
          curl -sSLo detekt.jar "https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar"
          java -jar detekt.jar --input native --build-upon-default-config --report txt:detekt-report.txt

      # Fix (audit đợt 2): trước đây chỉ upload detekt-report.txt - kết quả ESLint/Ruff chỉ nằm
      # trong log console của step (continue-on-error: true khiến chúng dễ bị lướt qua, và log
      # console khó đọc/tải trên điện thoại hơn nhiều so với 1 file artifact tải riêng). Giờ cả
      # 3 báo cáo đều được ghi ra file (xem "tee" ở 2 step Lint JS/Lint Python phía trên) và
      # upload chung 1 chỗ.
      - name: Upload báo cáo lint (ESLint/Ruff/Detekt đều continue-on-error nên cần artifact để tự xem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            eslint-report.txt
            ruff-report.txt
            detekt-report.txt
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # JOB 2/3: build-debug
  # ============================================================
  build-debug:
    needs: validation
    if: "!(github.event_name == 'workflow_dispatch' && inputs.build_release)"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Giải nén lại source (job này chạy trên runner riêng, không dùng chung ổ đĩa với job
      # validation). Fix (audit đợt 2): trước đây job này KHÔNG verify checksum (chỉ job
      # validation có) - dù cùng 1 commit nên về lý thuyết nội dung zip giống hệt, nhưng
      # maestro-ui-test.yml chạy như workflow riêng có thể ở commit KHÁC, và quan trọng hơn: nếu
      # sau này có ai đó tách job build-debug ra chạy độc lập không qua validation nữa, thiếu
      # bước này sẽ mất hẳn lớp bảo vệ - lặp lại logic verify checksum y hệt validation ở đây
      # cho nhất quán, không phụ thuộc giả định "chắc chắn cùng commit".
      - name: Extract project source (nếu còn ở dạng .zip) + verify checksum (nếu có)
        run: |
          shopt -s nullglob
          zips=(atun-translator-part*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Không thấy file atun-translator-part*.zip nào ở gốc repo - coi như source đã được giải nén sẵn (bỏ qua giải nén + verify checksum)."
          else
            for z in "${zips[@]}"; do
              if [ -f "$z.sha256" ]; then
                echo "Verify checksum $z..."
                sha256sum -c "$z.sha256" || { echo "::error::Checksum của $z không khớp file .sha256 đi kèm - source có thể bị hỏng/sửa ngoài ý muốn khi tải lên. Dừng build."; exit 1; }
              else
                echo "Không thấy $z.sha256 - bỏ qua verify checksum cho $z (tuỳ chọn, không bắt buộc)."
              fi
              echo "Giải nén $z"
              unzip -o -q "$z" -d .
            done
          fi
          test -f package.json || { echo "::error::Vẫn không thấy package.json sau khi giải nén."; exit 1; }

      - name: Install npm deps
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Copy native Kotlin sources vào package com.atun.translator
        run: |
          set -e
          shopt -s nullglob  # Fix (audit đợt 2): thiếu dòng này thì khi glob "native/*.kt" không khớp file nào, bash trả nguyên literal chuỗi "native/*.kt" cho vòng for - basename/rm sẽ chạy nhầm trên 1 tên file giả không tồn tại thay vì vòng lặp rỗng như mong đợi (im lặng sai, không fail rõ ràng).
          dest=android/app/src/main/java/com/atun/translator
          mkdir -p "$dest"
          for f in native/*.kt; do
            base=$(basename "$f" .kt)
            rm -f "$dest/$base.java"
          done
          cp native/*.kt "$dest/"

      # native-test/*.kt là unit test JUnit thuần: VadDetectorTest.kt, SttSegmentCutterTest.kt,
      # AudioPcmUtilsTest.kt - cả 3 test các class/hàm THUẦN (không đụng AudioRecord/Service/
      # Thread thật), các lớp còn lại đụng thẳng Android framework thì chưa - copy vào src/test/
      # (KHÔNG phải src/main/) để Gradle chạy bằng task `test`, không bị đóng gói vào APK thật.
      - name: Copy Kotlin unit tests vào src/test
        run: |
          set -e
          dest_test=android/app/src/test/java/com/atun/translator
          mkdir -p "$dest_test"
          cp native-test/*.kt "$dest_test/"

      - name: Patch Gradle/Manifest (Kotlin, permissions)
        run: |
          python3 scripts/patch-kotlin.py
          python3 scripts/patch-manifest.py

      # Robolectric (giả lập Android trên JVM) - CHỈ cần ở job này (nơi duy nhất chạy
      # testDebugUnitTest), không cần patch cho build-release vì job đó không chạy unit test.
      - name: Patch Robolectric (test dependencies)
        run: python3 scripts/patch-robolectric.py

      # Firebase Crashlytics/Performance/Analytics - HOÀN TOÀN TUỲ CHỌN, tự bỏ qua êm nếu chưa
      # set secret GOOGLE_SERVICES_JSON_BASE64 (khác keystore - secret này KHÔNG bắt buộc, thiếu
      # không chặn build). Xem README mục "Giám sát"/Firebase để biết cách tạo project Firebase +
      # lấy google-services.json.
      - name: Decode Firebase google-services.json (tuỳ chọn)
        id: decode_firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
            echo "Không có secret GOOGLE_SERVICES_JSON_BASE64 - bỏ qua Firebase Crashlytics/Performance/Analytics (tuỳ chọn, không bắt buộc)."
          else
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch Firebase Crashlytics/Performance/Analytics (nếu có google-services.json)
        if: steps.decode_firebase.outputs.has_firebase == 'true'
        run: python3 scripts/patch-firebase.py

      # Ghi versionCode/versionName thật vào android/app/build.gradle - mặc định Capacitor sinh
      # ra "versionCode 1 / versionName '1.0'" cố định, không đổi giữa các lần build. versionName
      # lấy từ package.json (bạn tự bump khi muốn đổi số phiên bản hiển thị cho người dùng, ví
      # dụ 1.0.0 -> 1.1.0).
      - name: Patch version (versionCode/versionName)
        env:
          APP_VERSION_NAME: ${{ needs.validation.outputs.app_version }}
        run: |
          # Fix (audit đợt 2): KHÔNG dùng run_number trần làm versionCode nữa. run_number KHÔNG
          # đổi khi bạn "Re-run this workflow"/"Re-run failed jobs" trên GitHub Actions - chỉ
          # run_attempt tăng. Nếu build-debug re-run sau khi APK lần đầu đã được lấy đi test/dùng,
          # dùng run_number trần sẽ tạo ra 1 APK re-run mang versionCode TRÙNG với lần trước -
          # ambiguous nếu 2 bản này khác nội dung do sửa gì đó giữa 2 lần bấm re-run. Nhân
          # run_number với 100 rồi cộng run_attempt đảm bảo versionCode vẫn tăng dần qua các lần
          # re-run của CÙNG 1 run, không chỉ qua các run khác nhau (giả định không re-run quá 99
          # lần/run - thực tế không ai làm vậy).
          export APP_VERSION_CODE=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          python3 scripts/patch-version.py

      - name: Grant execute permission cho gradlew
        run: chmod +x android/gradlew

      # Cache + tối ưu invocation Gradle (dependencies, build cache) - hoạt động ngay cả khi
      # thư mục android/ vừa được sinh ra ở bước trên (không cần gradlew tồn tại từ trước).
      - name: Setup Gradle (cache tự động)
        uses: gradle/actions/setup-gradle@v4

      # Chạy TRƯỚC assembleDebug - test fail thì dừng ngay, không tốn thời gian build tiếp 1 APK
      # từ code mà chính unit test vừa nói là sai.
      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Tạo build-info.json
        run: |
          cat > build-info.json <<EOF
          {
            "type": "debug",
            "version": "${{ needs.validation.outputs.app_version }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_number": "${{ github.run_number }}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atun-translator-debug-v${{ needs.validation.outputs.app_version }}-${{ github.sha }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            build-info.json
          retention-days: 7

  # ============================================================
  # JOB 3/3: build-release (chỉ chạy khi bấm tay + tick build_release)
  # ============================================================
  build-release:
    needs: validation
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-22.04
    # "environment: release" cho phép bật Required reviewers trên GitHub (Settings -> Environments
    # -> tạo môi trường tên "release" -> thêm Required reviewers) để job này DỪNG LẠI chờ phê
    # duyệt thủ công trước khi chạy - GitHub tự ghi log ai đã bấm Approve. Nếu bạn CHƯA tạo
    # Environment "release" trong repo Settings, dòng này không có tác dụng gì (job chạy bình
    # thường, không chặn) - không gây lỗi, chỉ là chưa bật tính năng phê duyệt.
    environment:
      name: release
    # Fix (audit đợt 2): job-level env để bước "Thông báo Slack" ở cuối có thể check qua
    # "env.SLACK_WEBHOOK_URL" thay vì đọc thẳng "secrets.SLACK_WEBHOOK_URL" trong "if:" - dùng
    # trực tiếp "secrets.*" trong biểu thức "if:" là pattern GitHub tự khuyến cáo tránh (secrets
    # context có thể không sẵn sàng ở giai đoạn "if:" được đánh giá tuỳ ngữ cảnh trigger, và lỗi
    # kiểu này thường ÂM THẦM khiến step bị coi là false/skip thay vì báo lỗi rõ ràng - rất khó
    # phát hiện vì trông như "chưa cấu hình Slack" trong khi thật ra là do cú pháp if sai chỗ).
    # Đưa qua "env:" ở cấp job là cách được khuyến nghị chính thức để dùng secret trong "if:".
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Kiểm tra nhánh được phép build release
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" != "main" && "$ref" != release/* ]]; then
            echo "::error::Chỉ cho phép build release từ nhánh 'main' hoặc 'release/*' (đang chạy từ nhánh '$ref'). Đổi sang đúng nhánh rồi chạy lại workflow_dispatch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Fix (audit đợt 2): job release cũng verify checksum như validation/build-debug - đây
      # chính là job build ra APK ký thật đi lên Play Store, càng không nên là job DUY NHẤT
      # thiếu lớp kiểm tra này.
      - name: Extract project source (nếu còn ở dạng .zip) + verify checksum (nếu có)
        run: |
          shopt -s nullglob
          zips=(atun-translator-part*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Không thấy file atun-translator-part*.zip nào ở gốc repo - coi như source đã được giải nén sẵn (bỏ qua giải nén + verify checksum)."
          else
            for z in "${zips[@]}"; do
              if [ -f "$z.sha256" ]; then
                echo "Verify checksum $z..."
                sha256sum -c "$z.sha256" || { echo "::error::Checksum của $z không khớp file .sha256 đi kèm - source có thể bị hỏng/sửa ngoài ý muốn khi tải lên. Dừng build."; exit 1; }
              else
                echo "Không thấy $z.sha256 - bỏ qua verify checksum cho $z (tuỳ chọn, không bắt buộc)."
              fi
              echo "Giải nén $z"
              unzip -o -q "$z" -d .
            done
          fi
          test -f package.json || { echo "::error::Vẫn không thấy package.json sau khi giải nén."; exit 1; }

      - name: Install npm deps
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Copy native Kotlin sources vào package com.atun.translator
        run: |
          set -e
          shopt -s nullglob  # Fix (audit đợt 2): thiếu dòng này thì khi glob "native/*.kt" không khớp file nào, bash trả nguyên literal chuỗi "native/*.kt" cho vòng for - basename/rm sẽ chạy nhầm trên 1 tên file giả không tồn tại thay vì vòng lặp rỗng như mong đợi (im lặng sai, không fail rõ ràng).
          dest=android/app/src/main/java/com/atun/translator
          mkdir -p "$dest"
          for f in native/*.kt; do
            base=$(basename "$f" .kt)
            rm -f "$dest/$base.java"
          done
          cp native/*.kt "$dest/"

      - name: Patch Gradle/Manifest (Kotlin, permissions)
        run: |
          python3 scripts/patch-kotlin.py
          python3 scripts/patch-manifest.py

      # Fix (audit đợt 2): trước đây job này KHÔNG chạy unit test Kotlin nào - build-release và
      # build-debug đều "needs: validation" nhưng chạy trên 2 runner ĐỘC LẬP (không dùng chung
      # kết quả cho nhau), và build-debug bị SKIP hẳn khi build_release=true (xem "if" của job
      # build-debug) - nghĩa là 1 lần bấm workflow_dispatch với build_release=true có thể ký +
      # phát hành APK release mà KHÔNG có unit test Kotlin nào chạy qua, kể cả khi
      # VadDetectorTest.kt đang FAIL. Không thể sửa bằng "needs: [validation, build-debug]" vì
      # build-debug bị skip trong đúng trường hợp này -> job build-release sẽ ăn theo bị skip
      # luôn (needs mặc định coi job phụ thuộc bị skip là điều kiện không thoả). Giải pháp: lặp
      # lại các bước chạy unit test ngay trong job này, TRƯỚC assembleRelease - trùng lặp vài
      # bước với build-debug nhưng đổi lại đảm bảo release luôn được gate bởi cùng bộ test.
      - name: Copy Kotlin unit tests vào src/test
        run: |
          set -e
          dest_test=android/app/src/test/java/com/atun/translator
          mkdir -p "$dest_test"
          cp native-test/*.kt "$dest_test/"

      - name: Patch Robolectric (test dependencies)
        run: python3 scripts/patch-robolectric.py

      - name: Grant execute permission cho gradlew (để chạy unit test trước khi setup Gradle action)
        run: chmod +x android/gradlew

      - name: Setup Gradle (cache tự động, dùng sớm hơn cho bước test)
        uses: gradle/actions/setup-gradle@v4

      # Chạy TRƯỚC mọi bước ký/patch version - release build không có lý do để tiếp tục nếu
      # unit test đang đỏ, và dừng sớm ở đây tránh phí công decode keystore/ký cho 1 bản build
      # coi như hỏng.
      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      # Xem giải thích ở job build-debug phía trên.
      - name: Decode Firebase google-services.json (tuỳ chọn)
        id: decode_firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
            echo "Không có secret GOOGLE_SERVICES_JSON_BASE64 - bỏ qua Firebase Crashlytics/Performance/Analytics (tuỳ chọn, không bắt buộc)."
          else
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch Firebase Crashlytics/Performance/Analytics (nếu có google-services.json)
        if: steps.decode_firebase.outputs.has_firebase == 'true'
        run: python3 scripts/patch-firebase.py

      # Xem giải thích công thức versionCode ở job build-debug phía trên (fix run_number không
      # đổi khi re-run) - CÀNG quan trọng ở job này vì đây mới là APK thật sự đi lên Play Store.
      - name: Patch version (versionCode/versionName)
        env:
          APP_VERSION_NAME: ${{ needs.validation.outputs.app_version }}
        run: |
          export APP_VERSION_CODE=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          python3 scripts/patch-version.py

      # gradlew đã được cấp quyền thực thi + Setup Gradle action đã chạy ở trên (trước bước unit
      # test) - không cần lặp lại 2 bước đó ở đây.

      # Fix (theo audit bảo mật): thiếu secret ANDROID_KEYSTORE_BASE64 sẽ FAIL CỨNG ngay ở bước
      # này - không âm thầm build bằng debug keystore. Muốn build debug để test nhanh: dùng
      # nhánh push/PR bình thường (job build-debug), không cần bật build_release.
      - name: Decode release keystore
        id: decode_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secret bắt buộc cho release build:$missing — dừng build, KHÔNG tạo APK ký tạm bằng debug keystore. Vào repo Settings -> Secrets and variables -> Actions để thêm đủ 4 secret trước khi chạy lại build_release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "signed_with_release_key=true" >> "$GITHUB_OUTPUT"

      - name: Patch release build (signing + minify + Proguard)
        run: python3 scripts/patch-release-build.py

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease

      # Xác thực chữ ký thật (không tin suông rằng bước ký ở trên "chắc chắn đã chạy đúng") -
      # build-tools đi kèm sẵn trong Android SDK cài trên GitHub-hosted runner.
      - name: Xác thực chữ ký APK release (apksigner)
        run: |
          build_tools_dir="$ANDROID_HOME/build-tools"
          latest=$(ls "$build_tools_dir" | sort -V | tail -1)
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$build_tools_dir/$latest/apksigner" verify --verbose "$apk"

      # Fix (audit đợt 2): "apksigner verify" ở trên chỉ xác nhận chữ ký HỢP LỆ về mặt kỹ thuật -
      # KHÔNG xác nhận đó có phải đúng key release bạn mong đợi hay không. Nếu secret
      # ANDROID_KEYSTORE_BASE64 vô tình bị đổi (rotate keystore mà quên cập nhật ghi chú, dán
      # nhầm secret của project khác, ...), bước "verify" ở trên vẫn PASS bình thường vì APK vẫn
      # tự ký/tự xác thực nhất quán - chỉ là ký bằng key SAI, và Google Play sẽ từ chối bản update
      # đó (khác cert với bản đã publish) - lúc đó mới phát hiện, quá trễ. In fingerprint SHA-256
      # ra log MỌI LẦN để đối chiếu bằng mắt; nếu có set thêm secret RELEASE_CERT_SHA256_FINGERPRINT
      # (giá trị lấy 1 lần từ `apksigner verify --print-certs` của keystore release thật, dạng
      # "AA:BB:...", so khớp không phân biệt hoa/thường) thì so khớp TỰ ĐỘNG và FAIL CỨNG nếu
      # lệch - tuỳ chọn (không set secret thì chỉ in ra, không chặn build, giữ đúng tinh thần các
      # secret tuỳ chọn khác trong file này).
      - name: In + đối chiếu fingerprint chứng chỉ ký APK release
        env:
          RELEASE_CERT_SHA256_FINGERPRINT: ${{ secrets.RELEASE_CERT_SHA256_FINGERPRINT }}
        run: |
          build_tools_dir="$ANDROID_HOME/build-tools"
          latest=$(ls "$build_tools_dir" | sort -V | tail -1)
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          certs_output=$("$build_tools_dir/$latest/apksigner" verify --print-certs "$apk")
          echo "$certs_output"
          actual=$(echo "$certs_output" | grep -i "SHA-256 digest" | head -1 | sed -E 's/.*:\s*//')
          echo "Fingerprint SHA-256 thật của APK vừa build: $actual"
          if [ -n "$RELEASE_CERT_SHA256_FINGERPRINT" ]; then
            expected_norm=$(echo "$RELEASE_CERT_SHA256_FINGERPRINT" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
            actual_norm=$(echo "$actual" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
            if [ "$expected_norm" != "$actual_norm" ]; then
              echo "::error::Fingerprint chứng chỉ ký KHÔNG khớp với RELEASE_CERT_SHA256_FINGERPRINT đã cấu hình - có thể keystore secret đã bị đổi/nhầm. Dừng build, KHÔNG phát hành APK ký sai key."
              exit 1
            fi
            echo "OK: fingerprint khớp với RELEASE_CERT_SHA256_FINGERPRINT đã cấu hình."
          else
            echo "Không có secret RELEASE_CERT_SHA256_FINGERPRINT - bỏ qua so khớp tự động (tuỳ chọn), chỉ in ra để bạn tự đối chiếu thủ công."
          fi

      - name: In permissions thật trong APK (đối chiếu thủ công với AndroidManifest)
        run: |
          build_tools_dir="$ANDROID_HOME/build-tools"
          latest=$(ls "$build_tools_dir" | sort -V | tail -1)
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$build_tools_dir/$latest/aapt2" dump badging "$apk" | grep -i "uses-permission\|package:" || true

      - name: Tạo build-info.json
        run: |
          cat > build-info.json <<EOF
          {
            "type": "release",
            "version": "${{ needs.validation.outputs.app_version }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_number": "${{ github.run_number }}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: atun-translator-release-v${{ needs.validation.outputs.app_version }}-${{ github.sha }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            build-info.json
          retention-days: 30

      # Tạo GitHub Release thật (tab Releases của repo) kèm APK đính kèm trực tiếp - khác với
      # artifact ở bước trên (artifact tự xoá sau 30 ngày + chỉ người có quyền vào Actions mới
      # tải được); Release thì tồn tại vĩnh viễn + link tải công khai được nếu repo public.
      # generate_release_notes: true dùng tính năng "Tự động sinh ghi chú phát hành" có sẵn của
      # GitHub (liệt kê PR đã merge kể từ lần tag gần nhất) - không cần thêm công cụ ngoài
      # (git-cliff...) hay quy ước commit message riêng nào.
      - name: Tạo GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validation.outputs.app_version }}-${{ github.run_number }}
          name: v${{ needs.validation.outputs.app_version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/*.apk

      # Hoàn toàn tuỳ chọn - chỉ chạy nếu bạn tự tạo secret SLACK_WEBHOOK_URL (repo Settings ->
      # Secrets and variables -> Actions). Không set thì bước này tự bỏ qua, KHÔNG làm build fail.
      - name: Thông báo Slack (tuỳ chọn)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Build release Android thành công - version ${{ needs.validation.outputs.app_version }}, commit ${{ github.sha }}, run #${{ github.run_number }}. Tải APK ở tab Actions -> Artifacts.\"}" \
            "$SLACK_WEBHOOK_URL"
