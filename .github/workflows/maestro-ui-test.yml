name: Maestro UI test (tuỳ chọn)

# CHỈ chạy tay (workflow_dispatch) - KHÔNG tự chạy trên push/PR/lịch cố định, vì:
#  - Cần khởi động Android emulator - tốn nhiều phút CI hơn hẳn so với build APK thường.
#  - Flow .maestro/translate-manual.yaml gọi THẬT tới groq-relay -> Groq/DeepL/Google Translate
#    free (không mock) - chạy tự động lặp lại (nightly/mỗi push) sẽ tốn quota thật không cần
#    thiết.
#  - Chưa tự verify được flow này chạy đúng trên emulator thật (xem cảnh báo đầu file
#    .maestro/translate-manual.yaml) - nên để người tự bấm chạy khi cần xem kết quả, không nên
#    để nó âm thầm fail lặp lại mỗi ngày mà không ai xem tới.
on:
  workflow_dispatch:

jobs:
  maestro-ui-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fix (audit đợt 2): workflow này chạy ĐỘC LẬP (không needs: validation của
      # android-build.yml, workflow_dispatch tay, có thể ở commit khác) - trước đây KHÔNG verify
      # checksum, nghĩa là source hỏng khi tải lên bằng điện thoại sẽ lọt thẳng vào build + cài
      # lên emulator + chạy test mà không ai biết cho tới khi thấy kết quả kỳ lạ. Copy nguyên
      # logic verify checksum từ job "validation" trong android-build.yml.
      - name: Extract project source (nếu còn ở dạng .zip) + verify checksum (nếu có)
        run: |
          shopt -s nullglob
          zips=(atun-translator-part*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Không thấy file atun-translator-part*.zip nào ở gốc repo - coi như source đã được giải nén sẵn (bỏ qua giải nén + verify checksum)."
          else
            for z in "${zips[@]}"; do
              if [ -f "$z.sha256" ]; then
                echo "Verify checksum $z..."
                sha256sum -c "$z.sha256" || { echo "::error::Checksum của $z không khớp file .sha256 đi kèm - source có thể bị hỏng/sửa ngoài ý muốn khi tải lên. Dừng build."; exit 1; }
              else
                echo "Không thấy $z.sha256 - bỏ qua verify checksum cho $z (tuỳ chọn, không bắt buộc)."
              fi
              echo "Giải nén $z"
              unzip -o -q "$z" -d .
            done
          fi
          test -f package.json || { echo "::error::Vẫn không thấy package.json sau khi giải nén."; exit 1; }

      - name: Install npm deps
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Copy native Kotlin sources vào package com.atun.translator
        run: |
          set -e
          shopt -s nullglob  # Fix (audit đợt 2): thiếu dòng này thì khi glob "native/*.kt" không khớp file nào, bash trả nguyên literal chuỗi "native/*.kt" cho vòng for - basename/rm sẽ chạy nhầm trên 1 tên file giả không tồn tại thay vì vòng lặp rỗng như mong đợi (im lặng sai, không fail rõ ràng).
          dest=android/app/src/main/java/com/atun/translator
          mkdir -p "$dest"
          for f in native/*.kt; do
            base=$(basename "$f" .kt)
            rm -f "$dest/$base.java"
          done
          cp native/*.kt "$dest/"

      - name: Patch Gradle/Manifest (Kotlin, permissions)
        run: |
          python3 scripts/patch-kotlin.py
          python3 scripts/patch-manifest.py

      - name: Grant execute permission cho gradlew
        run: chmod +x android/gradlew

      - name: Setup Gradle (cache tự động)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Cài Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # reactivecircus/android-emulator-runner tự tạo + khởi động emulator (có tăng tốc phần
      # cứng KVM trên GitHub-hosted Linux runner), cài APK, chạy đúng 1 lệnh shell truyền vào,
      # rồi tự tắt emulator - gói gọn trong 1 step thay vì tự quản lý emulator thủ công.
      - name: Chạy Maestro flow trên emulator Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/translate-manual.yaml

      - name: Upload kết quả Maestro (ảnh chụp màn hình lúc fail, nếu có)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results-${{ github.run_number }}
          path: ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

      # Fix (audit đợt 2): trước đây flow fail thì chỉ có ảnh chụp màn hình Maestro (đủ để biết
      # UI dừng ở đâu, nhưng KHÔNG đủ để tự cài lại đúng APK đã fail lên máy/emulator thật để
      # dò tiếp bằng tay) - upload luôn APK debug đã build, "if: always()" để có cả khi
      # assembleDebug hay bước Maestro fail giữa chừng (APK vẫn tồn tại nếu assembleDebug đã
      # xong trước khi Maestro mới fail).
      - name: Upload APK debug đã dùng để test (kể cả khi Maestro fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: ignore
