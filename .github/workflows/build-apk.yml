name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source if present
        run: |
          if [ -f "atun-translator-source.zip" ]; then
            unzip -o atun-translator-source.zip -d .
            echo "Unzipped source files into repo root"
          fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Patch AndroidManifest.xml
        run: python3 scripts/patch-manifest.py

      - name: Copy native Kotlin sources
        run: |
          PKG_DIR="android/app/src/main/java/com/atun/translator"
          mkdir -p "$PKG_DIR"
          cp native/MainActivity.kt "$PKG_DIR/MainActivity.kt"
          cp native/OverlayWindowPlugin.kt "$PKG_DIR/OverlayWindowPlugin.kt"
          cp native/OverlayView.kt "$PKG_DIR/OverlayView.kt"
          cp native/ForegroundService.kt "$PKG_DIR/ForegroundService.kt"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package output as zip
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/atun-translator-debug.apk
          cd release
          zip -r atun-translator-build.zip atun-translator-debug.apk

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: atun-translator-build
          path: release/atun-translator-build.zip

      - name: Upload raw APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
