
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cần quyền ghi (contents: write) để bước tạo/cập nhật GitHub Release "latest" kèm APK ở cuối
# file có thể tạo release + upload file đính kèm bằng GITHUB_TOKEN mặc định (không cần tạo
# Personal Access Token riêng).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actions KHÔNG cho dùng context `secrets` trực tiếp trong `if:` của step
    # (lỗi "Unrecognized named-value: 'secrets'"). Cách chuẩn: gán ra biến env ở
    # cấp job (env context ĐƯỢC phép đọc secrets khi định nghĩa), rồi so sánh env.X
    # trong if: ở dưới.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source parts if present
        run: |
          shopt -s nullglob
          parts=(atun-translator-part*.zip)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No atun-translator-part*.zip files found in repo root, skipping."
          else
            for f in "${parts[@]}"; do
              echo "Unzipping $f"
              unzip -o "$f" -d .
            done
            echo "Unzipped all source parts into repo root"
          fi
          ls -la

      # ===== Test harness (tests/vad, tests/translate, tests/model_catalog) =====
      # Chạy NGAY SAU khi unzip source, TRƯỚC khi build Android (build thật tốn nhiều phút) -
      # để fail nhanh nếu code/catalog có lỗi rõ ràng, thay vì đợi build xong cả chục phút rồi
      # mới biết. tests/model_catalog đặc biệt quan trọng: nó đọc THẲNG CATALOG thật trong
      # native/ModelManagerPlugin.kt và (với -m network) gửi HEAD request kiểm tra từng URL model
      # (kể cả mirrorUrl dự phòng) có thật sự tải được không - đây chính là lớp bug đã từng gặp
      # (URL sai/model gỡ bỏ chỉ phát hiện được lúc bấm tải trên máy thật, báo "Lỗi tải - thử
      # lại"). CI có mạng thật nên chạy được cả test mạng ở đây, không chỉ test tĩnh.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài pytest cho test harness
        run: pip install pytest

      - name: Chạy test harness (vad, translate, model_catalog)
        run: |
          set -e
          # Guard bằng [ -d ... ] trước mỗi cd: lỗi "cd: tests/vad: No such file or directory"
          # từng gặp là vì repo chưa có (chưa commit/giải nén) thư mục tests/ tương ứng - trước
          # đây "cd" thẳng vào thư mục không tồn tại làm cả job dừng luôn dù phần build Android
          # phía sau không hề liên quan. Giờ thư mục nào thiếu thì CẢNH BÁO rồi bỏ qua, không
          # chặn build APK - nhắc bạn nhớ commit đủ tests/vad, tests/translate, tests/model_catalog
          # (đã gửi ở atun-translator-part6.zip/part7.zip) vào repo để lần build sau test chạy thật.
          run_tests() {
            if [ -d "$1" ]; then
              echo "== $1 =="
              (cd "$1" && pytest -v $2)
            else
              echo "CẢNH BÁO: thiếu thư mục $1 trong repo - bỏ qua test này (build APK vẫn tiếp tục)."
            fi
          }
          run_tests tests/vad
          run_tests tests/translate
          run_tests tests/model_catalog "-m network"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install

      - name: Clean and add Android platform (always fresh)
        run: |
          rm -rf android
          npx cap add android

      - name: Patch AndroidManifest.xml
        run: python3 scripts/patch-manifest.py

      - name: Patch Kotlin support into Gradle
        run: python3 scripts/patch-kotlin.py

      - name: Patch Vosk dependency into Gradle
        run: python3 scripts/patch-vosk-gradle.py

      - name: Patch ML Kit Translate dependency into Gradle
        run: python3 scripts/patch-mlkit-gradle.py

      - name: Patch release signing + minify/proguard into Gradle
        run: python3 scripts/patch-release-build.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy native Kotlin sources (runs LAST, after sync)
        run: |
          PKG_DIR="android/app/src/main/java/com/atun/translator"
          mkdir -p "$PKG_DIR"
          rm -f "$PKG_DIR/MainActivity.java"
          cp native/MainActivity.kt "$PKG_DIR/MainActivity.kt"
          cp native/OverlayWindowPlugin.kt "$PKG_DIR/OverlayWindowPlugin.kt"
          cp native/OverlayView.kt "$PKG_DIR/OverlayView.kt"
          cp native/AudioCaptureService.kt "$PKG_DIR/AudioCaptureService.kt"
          cp native/AudioCapturePlugin.kt "$PKG_DIR/AudioCapturePlugin.kt"
          cp native/ModelManagerPlugin.kt "$PKG_DIR/ModelManagerPlugin.kt"
          cp native/MlkitTranslatePlugin.kt "$PKG_DIR/MlkitTranslatePlugin.kt"
          cp native/VoskEngine.kt "$PKG_DIR/VoskEngine.kt"
          cp native/VadDetector.kt "$PKG_DIR/VadDetector.kt"
          cp native/ExportPlugin.kt "$PKG_DIR/ExportPlugin.kt"
          cp native/AppLog.kt "$PKG_DIR/AppLog.kt"
          cp native/TtsPlugin.kt "$PKG_DIR/TtsPlugin.kt"

      - name: Copy Vosk model assets
        run: python3 scripts/copy-model-assets.py

      - name: Debug - verify MainActivity actually has registerPlugin
        run: |
          PKG_DIR="android/app/src/main/java/com/atun/translator"
          echo "=== Contents of $PKG_DIR ==="
          ls -la "$PKG_DIR"
          if [ -f "$PKG_DIR/MainActivity.java" ]; then
            echo "FAIL"
            exit 1
          fi
          if grep -q "registerPlugin" "$PKG_DIR/MainActivity.kt"; then
            echo "OK"
          else
            echo "FAIL"
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package debug output as zip
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/atun-translator-debug.apk
          cd release
          zip -r atun-translator-build.zip atun-translator-debug.apk

      - name: Upload debug zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: atun-translator-build
          path: release/atun-translator-build.zip

      - name: Upload raw debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore (nếu đã cấu hình secret riêng)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APK (minified, ký bằng keystore riêng hoặc debug keystore)
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Package release output as zip
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk release/atun-translator-release.apk
          cd release
          zip -r atun-translator-release-build.zip atun-translator-release.apk

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: atun-translator-release-build
          path: release/atun-translator-release-build.zip

      - name: Upload raw release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Copy release APK sang tên file cố định (dùng cho link tải công khai)
        run: cp android/app/build/outputs/apk/release/app-release.apk release/atun-translator.apk

      # Tạo/cập nhật 1 GitHub Release duy nhất (tag "latest") kèm APK - cho link tải công khai
      # CỐ ĐỊNH, không cần đăng nhập GitHub, dùng được ngay trên trang web-mini (index.html):
      #   https://github.com/<user>/<repo>/releases/latest/download/atun-translator.apk
      # Khác Artifact của Actions (bắt buộc đăng nhập, tự xoá sau 90 ngày, link đổi mỗi build).
      - name: Tạo/cập nhật GitHub Release "latest" kèm APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/atun-translator.apk \
            --title "Atun Translator (build tự động)" \
            --notes "Build tự động từ GitHub Actions - commit ${{ github.sha }}. Bản release ký bằng keystore riêng (nếu đã cấu hình secret ANDROID_KEYSTORE_BASE64) hoặc debug keystore (chỉ để tự cài/side-load, KHÔNG dùng để phát hành Play Store - và có thể không cài đè lên bản cũ được nếu chữ ký debug keystore đổi giữa các lần build, phải gỡ cài đặt bản cũ trước)." \
            --latest
