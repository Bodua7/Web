name: Android build

# Build APK debug cho mọi push/PR vào main; build + ký APK release CHỈ khi
# tự bấm chạy tay (workflow_dispatch) - tránh tốn phút CI ký/minify không cần
# thiết trên mỗi commit nhỏ.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build APK release (đã ký + minify) thay vì debug"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GitHub KHÔNG tự giải nén file .zip lúc upload - nếu bạn commit thẳng các file
      # atun-translator-part*.zip (chưa tự giải nén trên máy/điện thoại), bước này tự giải nén
      # chúng ra gốc repo trước khi npm install/build. Nếu source đã ở dạng thư mục thật (đã tự
      # giải nén rồi mới commit) thì bước này tự bỏ qua, không làm gì cả.
      - name: Extract project source (nếu còn ở dạng .zip)
        run: |
          shopt -s nullglob
          zips=(atun-translator-part*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Không thấy file atun-translator-part*.zip nào ở gốc repo - coi như source đã được giải nén sẵn (bỏ qua bước này)."
          else
            for z in "${zips[@]}"; do
              echo "Giải nén $z"
              unzip -o -q "$z" -d .
            done
          fi
          test -f package.json || { echo "::error::Vẫn không thấy package.json sau khi giải nén - kiểm tra lại các file .zip đã commit đủ 4 part chưa (native/www/config-scripts/backend-tests)."; exit 1; }

      - name: Install npm deps
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Copy native Kotlin sources vào package com.atun.translator
        run: |
          mkdir -p android/app/src/main/java/com/atun/translator
          cp native/*.kt android/app/src/main/java/com/atun/translator/

      - name: Patch Gradle/Manifest (Kotlin, Vosk, ML Kit, permissions)
        run: |
          python3 scripts/patch-kotlin.py
          python3 scripts/patch-vosk-gradle.py
          python3 scripts/patch-mlkit-gradle.py
          python3 scripts/patch-manifest.py

      - name: Grant execute permission cho gradlew
        run: chmod +x android/gradlew

      # ===== Nhánh RELEASE: chỉ chạy khi workflow_dispatch với build_release=true. =====
      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Chưa set secret ANDROID_KEYSTORE_BASE64 - patch-release-build.py sẽ tự dùng debug keystore (chỉ để side-load, không dùng phát hành Play Store)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Patch release build (signing + minify + Proguard)
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        run: python3 scripts/patch-release-build.py

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: atun-translator-release
          path: android/app/build/outputs/apk/release/*.apk

      # ===== Nhánh DEBUG: mặc định cho push/PR, hoặc workflow_dispatch không tick build_release. =====
      - name: Build debug APK
        if: "!(github.event_name == 'workflow_dispatch' && inputs.build_release)"
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: "!(github.event_name == 'workflow_dispatch' && inputs.build_release)"
        uses: actions/upload-artifact@v4
        with:
          name: atun-translator-debug
          path: android/app/build/outputs/apk/debug/*.apk

      # ===== Test Python độc lập (VAD, translate free, model catalog) - không phụ thuộc
      # bước build Android ở trên, chạy song song ý nghĩa (không cần APK để test logic). =====
      - name: Run Python tests
        run: |
          pip install pytest requests
          pytest tests/vad tests/translate tests/model_catalog -v
